# CI — enforces the green build/test/lint baseline on every push to main and on every PR.
# golangci-lint is pinned (see lint job) so local (make lint) and CI agree exactly.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # PRs only; preserves main CI history

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
        # Unit tests only. Acceptance tests (TestAcc*) are gated by VAULT_ACC=1
        # and require a live/containerized PVE — not run here.

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2   # keep in sync with Makefile GOLANGCI_LINT_VERSION; floor: action downloads a pre-built binary that must be built with Go >= this module's language version (go 1.25.7); v2.12.2 satisfies that.
