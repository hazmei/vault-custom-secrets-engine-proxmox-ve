# CI — enforces the green build/test/lint baseline on every push to main and on every PR.
# golangci-lint is pinned (see lint job) so local (make lint) and CI agree exactly.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # PRs only; preserves main CI history

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
        # Unit tests only. Acceptance tests (TestAcc*) are operator-run only
        # against a disposable/dev PVE cluster via make testacc — never run here.

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # keep in sync with Makefile GOLANGCI_LINT_VERSION.
          # Floor: the action downloads a pre-built binary that must be built with
          # Go >= this module's language version (go 1.25.7); v2.12.2 satisfies that.
          version: v2.12.2
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: verify-plugin-artifact smoke
        run: |
          fixture=$(mktemp -d "$RUNNER_TEMP/verify-plugin.XXXXXX")
          trap 'rm -rf "$fixture"' EXIT
          d="$fixture/plugins"
          mkdir -p "$d"
          install -m 0755 /bin/true "$d/vault-plugin-secrets-proxmox"
          sha=$(sha256sum "$d/vault-plugin-secrets-proxmox" | cut -d' ' -f1)
          EXPECTED_SHA="$sha" EXPECTED_OWNER="$(id -un):$(id -gn)" \
            PLUGIN_DIR="$d" scripts/verify-plugin-artifact.sh
          ! EXPECTED_SHA=deadbeef EXPECTED_OWNER="$(id -un):$(id -gn)" \
            PLUGIN_DIR="$d" scripts/verify-plugin-artifact.sh
          if streamed_output=$(sh -c 'EXPECTED_SHA=deadbeef \
            EXPECTED_OWNER="$2" PLUGIN_DIR="$1" bash -s' \
            _ "$d" "$(id -un):$(id -gn)" < scripts/verify-plugin-artifact.sh); then
            echo "streamed verifier unexpectedly succeeded"
            exit 1
          fi
          case "$streamed_output" in
            *"FAIL: digest does not match"*) ;;
            *)
              printf '%s\n' "$streamed_output"
              echo "streamed verifier failed for the wrong reason"
              exit 1
              ;;
          esac
          sh -c 'EXPECTED_SHA="$3" \
            EXPECTED_OWNER="$2" PLUGIN_DIR="$1" bash -s' \
            _ "$d" "$(id -un):$(id -gn)" "$sha" < scripts/verify-plugin-artifact.sh
          ! timeout 30 env EXPECTED_SHA="$sha" \
            EXPECTED_OWNER="$(id -un):$(id -gn)" PLUGIN_DIR=relative \
            scripts/verify-plugin-artifact.sh
