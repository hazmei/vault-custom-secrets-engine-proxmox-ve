name: Live acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  testacc:
    name: Proxmox VE acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VAULT_ACC: "1"
      PVE_ADDR: ${{ secrets.PVE_ADDR }}
      PVE_TOKEN_ID: ${{ secrets.PVE_TOKEN_ID }}
      PVE_TOKEN_SECRET: ${{ secrets.PVE_TOKEN_SECRET }}
      PVE_TEST_GROUP: ${{ secrets.PVE_TEST_GROUP }}
      PVE_BEHAVIORAL_PATH: ${{ secrets.PVE_BEHAVIORAL_PATH }}
      PVE_BEHAVIORAL_MARKER: ${{ secrets.PVE_BEHAVIORAL_MARKER }}
      PVE_BEHAVIORAL_METHOD: ${{ secrets.PVE_BEHAVIORAL_METHOD }}
      PVE_NEGATIVE_AUTH_PATH: ${{ secrets.PVE_NEGATIVE_AUTH_PATH }}
      PVE_NEGATIVE_AUTH_METHOD: ${{ secrets.PVE_NEGATIVE_AUTH_METHOD }}
      PVE_ACL_CANARY_PATH: ${{ secrets.PVE_ACL_CANARY_PATH }}
      PVE_ACL_CANARY_UNHELD_ROLE: ${{ secrets.PVE_ACL_CANARY_UNHELD_ROLE }}
      PVE_ACL_CANARY_TARGET_USER: ${{ secrets.PVE_ACL_CANARY_TARGET_USER }}
      PVE_INSUFFICIENT_TOKEN_ID: ${{ secrets.PVE_INSUFFICIENT_TOKEN_ID }}
      PVE_INSUFFICIENT_TOKEN_SECRET: ${{ secrets.PVE_INSUFFICIENT_TOKEN_SECRET }}
      PVE_CONCURRENT_WORKERS: ${{ secrets.PVE_CONCURRENT_WORKERS }}
      PVE_CA_CERT: ${{ secrets.PVE_CA_CERT }}
      PVE_TLS_SKIP_VERIFY: ${{ secrets.PVE_TLS_SKIP_VERIFY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache: true

      - name: Preflight required acceptance secrets
        shell: bash
        run: |
          missing=()
          for name in PVE_ADDR PVE_TOKEN_ID PVE_TOKEN_SECRET PVE_TEST_GROUP PVE_BEHAVIORAL_PATH PVE_BEHAVIORAL_MARKER; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required acceptance secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Run live acceptance tests
        run: go test -v ./... -run TestAcc -count=1
